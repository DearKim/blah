<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/icons/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d9e75" />

    <!-- 보안 메타 — 서버 헤더(.htaccess)와 함께 이중 적용. CSP/Frame-Options 는 .htaccess 에 둠. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="robots" content="index, follow" />

    <!-- SUIT Variable — public/fonts/ 자체 호스팅. @font-face 는 globals.css 에서 선언. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/SUIT-Variable.woff2"
      crossorigin="anonymous"
    />

    <title>BLAH — 고객의 편의를 위한 정보 서비스</title>
    <meta
      name="description"
      content="BLAH는 흩어진 정보를 한곳에서 객관적으로 비교·탐색할 수 있는 정보 서비스를 만듭니다. 의료 AI 정보 플랫폼 A.PAGO, 초단기 긱워크 매칭 TEUM 을 운영합니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BLAH — 고객의 편의를 위한 정보 서비스" />
    <meta
      property="og:description"
      content="흩어진 정보를 한곳에서 객관적으로 비교·탐색할 수 있도록 만듭니다."
    />
    <meta property="og:site_name" content="BLAH" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
